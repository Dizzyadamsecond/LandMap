<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>LandMap — Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: 'DM Sans', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #14121f;
      background: radial-gradient(1200px 600px at 50% -10%, #2a2350 0%, #14121f 60%);
      color: #e9e9f0;
      display: flex; align-items: center; justify-content: center;
      min-height: 100dvh; padding: 24px; text-align: center;
    }
    .card {
      max-width: 420px; padding: 32px;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      background: rgba(20,18,31,0.7);
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }
    .logo { font-weight: 700; font-size: 22px; letter-spacing: -0.02em; }
    .logo span { color: #8b7cff; }
    .badge {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px; border-radius: 999px; font-size: 12px;
      background: rgba(139,124,255,0.12); color: #b9b0ff;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin: 8px 0 6px; }
    p { color: #a7a3bd; font-size: 14px; line-height: 1.5; margin: 8px 0 20px; }
    button {
      appearance: none; border: 0; cursor: pointer;
      background: #6d5efc; color: white; font-weight: 600; font-size: 14px;
      padding: 12px 18px; border-radius: 12px; width: 100%;
    }
    button:active { transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Land<span>Map</span></div>
    <div class="badge">● Sem conexão</div>
    <h1>Você está offline</h1>
    <p>
      O LandMap guarda as páginas que você já visitou. Reconecte para ver o mapa
      completo e os dados em tempo real.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
  </div>
</body>
</html>
