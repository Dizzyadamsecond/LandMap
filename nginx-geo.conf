user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" "$http_x_forwarded_for"';

  access_log /var/log/nginx/access.log main;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  types_hash_max_size 2048;
  client_max_body_size 500M;

  # Gzip compression
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml text/javascript
             application/json application/javascript application/xml+rss
             application/rss+xml image/svg+xml;

  # Cache definitions
  proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tile_cache:100m max_size=1g inactive=30d use_temp_path=off;
  proxy_cache_path /var/cache/nginx/imagery levels=1:2 keys_zone=imagery_cache:50m max_size=500m inactive=90d use_temp_path=off;

  # =========================================================================
  # Upstream services
  # =========================================================================

  upstream api_backend {
    least_conn;
    server localhost:3001 max_fails=3 fail_timeout=30s;
  }

  upstream titiler_server {
    least_conn;
    server titiler:8000 max_fails=3 fail_timeout=30s;
  }

  upstream redis_server {
    server redis-geo:6379;
  }

  # =========================================================================
  # Server block — LandMap Geo API + Tiles
  # =========================================================================

  server {
    listen 80 default_server;
    server_name localhost *.landmap.local;

    # Health check endpoint
    location /health {
      access_log off;
      return 200 "OK\n";
      add_header Content-Type text/plain;
    }

    # =====================================================================
    # VECTOR TILES (.pbf) — MapLibre GL JS
    # =====================================================================
    location ~ ^/api/geo/tiles/(?<z>\d+)/(?<x>\d+)/(?<y>\d+)\.pbf$ {
      proxy_pass http://api_backend;
      proxy_cache tile_cache;
      proxy_cache_valid 200 30d;  # Cache hits untuk 30 dias
      proxy_cache_lock on;  # Avoid cache stampede
      proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

      # Cache headers (client-side)
      add_header Cache-Control "public, max-age=604800" always;  # 7 dias
      add_header X-Cache-Status $upstream_cache_status always;
      add_header Vary "Accept-Encoding" always;

      # CORS
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

      # Compression
      gzip on;
      gzip_types application/x-protobuf;
    }

    # =====================================================================
    # IMAGERY (.tif COG) — TiTiler + Range requests
    # =====================================================================
    location ~ ^/api/geo/imagery/(?<source>\w+)/(?<z>\d+)/(?<x>\d+)/(?<y>\d+) {
      # Forward to TiTiler (raster tile server)
      proxy_pass http://titiler_server/cog/tiles/$z/$x/$y?url=/data/$source/$z/$x/$y.tif;

      proxy_cache imagery_cache;
      proxy_cache_valid 200 90d;
      proxy_cache_lock on;

      # Range request support (HTTP 206)
      proxy_http_version 1.1;
      proxy_set_header Range $http_range;
      proxy_pass_request_headers on;

      # Cache headers
      add_header Cache-Control "public, max-age=2592000" always;  # 30 dias
      add_header Accept-Ranges bytes always;
      add_header X-Cache-Status $upstream_cache_status always;

      # CORS
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Range" always;
    }

    # =====================================================================
    # SEARCH API — Terrenos/features
    # =====================================================================
    location /api/geo/terrenos/search {
      proxy_pass http://api_backend;

      proxy_cache tile_cache;
      proxy_cache_valid 200 1h;  # Query cache por 1 hora
      proxy_cache_methods GET HEAD;
      proxy_cache_key "$scheme$proxy_host$request_uri";

      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Cache-Status $upstream_cache_status always;

      # CORS
      add_header Access-Control-Allow-Origin "*" always;
    }

    # =====================================================================
    # FEATURE DETAILS — Terreno individual
    # =====================================================================
    location ~ ^/api/geo/terrenos/[a-f0-9\-]+$ {
      proxy_pass http://api_backend;

      proxy_cache tile_cache;
      proxy_cache_valid 200 24h;  # Cache por 24 horas (dados relativamente estáticos)

      add_header Cache-Control "public, max-age=86400" always;
      add_header X-Cache-Status $upstream_cache_status always;

      # CORS
      add_header Access-Control-Allow-Origin "*" always;
    }

    # =====================================================================
    # METRICS API
    # =====================================================================
    location ~ ^/api/geo/terrenos/[a-f0-9\-]+/metrics$ {
      proxy_pass http://api_backend;

      proxy_cache tile_cache;
      proxy_cache_valid 200 24h;

      add_header Cache-Control "public, max-age=86400" always;
      add_header X-Cache-Status $upstream_cache_status always;

      add_header Access-Control-Allow-Origin "*" always;
    }

    # =====================================================================
    # STATISTICS — Global geo stats
    # =====================================================================
    location /api/geo/stats {
      proxy_pass http://api_backend;

      proxy_cache tile_cache;
      proxy_cache_valid 200 1h;

      add_header Cache-Control "public, max-age=3600" always;
      add_header X-Cache-Status $upstream_cache_status always;

      add_header Access-Control-Allow-Origin "*" always;
    }

    # =====================================================================
    # FAVORITES API — Requer auth
    # =====================================================================
    location /api/geo/favorites {
      proxy_pass http://api_backend;

      # Sem cache para operações autenticadas
      add_header Cache-Control "private, no-cache, no-store, must-revalidate" always;

      # Require x-user-id header
      if ($http_x_user_id = "") {
        return 401;
      }

      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    }

    # =====================================================================
    # Static Tiles (fallback — servir direto do FS se existirem)
    # =====================================================================
    location ~ ^/tiles/(?<z>\d+)/(?<x>\d+)/(?<y>\d+)\.pbf$ {
      alias /var/www/tiles/$z/$x/$y.pbf;

      # Try cache, fallback para arquivo
      try_files $uri @api_geo_tiles;

      add_header Cache-Control "public, max-age=604800" always;
      add_header Access-Control-Allow-Origin "*" always;

      gzip_types application/x-protobuf;
    }

    location @api_geo_tiles {
      proxy_pass http://api_backend/api/geo/tiles/$z/$x/$y.pbf;
      add_header Cache-Control "public, max-age=604800" always;
    }

    # =====================================================================
    # OPTIONS (CORS preflight)
    # =====================================================================
    location /api/geo {
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, x-user-id, Authorization" always;
        add_header Access-Control-Max-Age "86400" always;
        return 204;
      }
    }

    # =====================================================================
    # Root / health
    # =====================================================================
    location / {
      root /var/www/html;
      try_files $uri $uri/ =404;
    }

    # =====================================================================
    # Error pages
    # =====================================================================
    error_page 404 /404.json;
    error_page 500 502 503 504 /50x.json;

    location = /404.json {
      internal;
      default_type application/json;
      return 404 '{"error": "Not Found"}';
    }

    location = /50x.json {
      internal;
      default_type application/json;
      return 500 '{"error": "Internal Server Error"}';
    }
  }
}
