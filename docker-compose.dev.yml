version: '3.9'

services:
  # Databases
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: landmap
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: landmap_timeseries
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Microservices (Rust)
  risk-service:
    build:
      context: packages/risk-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://dev:dev@postgres:5432/landmap
      REDIS_URL: redis://redis:6379
      SERVICE_PORT: 3002
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: cargo run --release

  settlement-service:
    build:
      context: packages/settlement-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://dev:dev@postgres:5432/landmap
      TIMESCALE_URL: postgresql://dev:dev@timescaledb:5432/landmap_timeseries
      SERVICE_PORT: 3006
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    command: cargo run --release

  # Microservices (Python)
  matching-service:
    build:
      context: packages/matching-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://dev:dev@postgres:5432/landmap
      REDIS_URL: redis://redis:6379
      SERVICE_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 3001

  price-prediction-service:
    build:
      context: packages/price-prediction-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://dev:dev@postgres:5432/landmap
      TIMESCALE_URL: postgresql://dev:dev@timescaledb:5432/landmap_timeseries
      SERVICE_PORT: 3005
    ports:
      - "3005:3005"
    depends_on:
      timescaledb:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 3005

  # Microservices (Go)
  portfolio-service:
    build:
      context: packages/portfolio-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://dev:dev@postgres:5432/landmap
      REDIS_URL: redis://redis:6379
      SERVICE_PORT: 3004
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: go run main.go

  analytics-service:
    build:
      context: packages/analytics-service
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://dev:dev@postgres:5432/landmap
      DUCKDB_PATH: /data/landmap.duckdb
      SERVICE_PORT: 3005
    ports:
      - "3005:3005"
    volumes:
      - duckdb_data:/data
    depends_on:
      postgres:
        condition: service_healthy
    command: go run main.go

  # API Gateway
  gateway:
    image: nginx:alpine
    ports:
      - "8000:8000"
    volumes:
      - ./infrastructure/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - risk-service
      - settlement-service
      - matching-service
      - price-prediction-service
      - portfolio-service
      - analytics-service

  # Message broker monitor
  rabbitmq-ui:
    image: rabbitmq:3.13-management-alpine
    depends_on:
      - rabbitmq

volumes:
  postgres_data:
  timescale_data:
  duckdb_data:
